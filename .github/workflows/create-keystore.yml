name: 1) Create signing key (فقط یک بار)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore nobatyar.jks -alias nobatyar -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Navid Salari, O=Nobatyab, C=IR"
          base64 -w0 nobatyar.jks > keystore.base64.txt
          {
            echo "KEYSTORE_BASE64  = (محتوای فایل keystore.base64.txt)"
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_ALIAS         = nobatyar"
            echo "KEY_PASSWORD      = $PASS"
          } > secrets-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key-KEEP-SAFE
          path: |
            nobatyar.jks
            keystore.base64.txt
            secrets-info.txt
          retention-days: 3
